[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-memory-field"
version = "0.4.0"
description = "Physics-based memory architecture using structural field deformation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.21.0"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
viz = ["matplotlib>=3.5"]
config = ["pyyaml>=6.0"]
test = ["pytest>=7.0", "pytest-timeout>=2.0", "matplotlib>=3.5"]
dev = ["pytest>=7.0", "pytest-timeout>=2.0", "ruff>=0.1", "matplotlib>=3.5"]
all = ["structural-memory-field[torch,viz,config,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
